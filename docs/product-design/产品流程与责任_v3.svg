<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1840" viewBox="0 0 1400 1840"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53789b"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267c66"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b57525"/></marker></defs><rect width="1400" height="1840" fill="#f5f8fc"/><rect width="1400" height="166" fill="#193047"/><text x="48" y="64" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="600" fill="#ffffff">医学问询协作与知识沉淀</text><text x="48" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#d3e1ee">医学部完成专业解答 · AI辅助准备与复查 · 销售使用成果并积累经验</text><rect x="350" y="210" width="690" height="136" rx="12" fill="#ffffff" stroke="#cbd9e8" stroke-width="2"/><rect x="350" y="222" width="7" height="112" rx="3" fill="#2c65a2"/><text x="372" y="249" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="600" fill="#213b54">① 需求澄清</text><text x="372" y="286" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">销售录入原问题，AI提示缺项</text><text x="372" y="318" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">销售确认子问题、背景与用途</text><rect x="350" y="410" width="690" height="136" rx="12" fill="#ffffff" stroke="#cbd9e8" stroke-width="2"/><rect x="350" y="422" width="7" height="112" rx="3" fill="#2c65a2"/><text x="372" y="449" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="600" fill="#213b54">② 证据准备</text><text x="372" y="486" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">AI检索指定资料，定位原文与出处</text><text x="372" y="518" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">交给医学部：问题包＋证据包</text><rect x="350" y="600" width="690" height="136" rx="12" fill="#eff8f3" stroke="#bcdccd" stroke-width="2"/><rect x="350" y="612" width="7" height="112" rx="3" fill="#267c66"/><text x="372" y="639" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="600" fill="#213b54">③ 医学部解答</text><text x="372" y="676" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">医学人员判断资料、补查并撰写答复</text><text x="372" y="708" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">说明依据、适用范围和未能回答的部分</text><rect x="350" y="790" width="690" height="136" rx="12" fill="#ffffff" stroke="#cbd9e8" stroke-width="2"/><rect x="350" y="802" width="7" height="112" rx="3" fill="#2c65a2"/><text x="372" y="829" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="600" fill="#213b54">④ 完整性复查</text><text x="372" y="866" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">AI逐项对照原问题，提示可能遗漏</text><text x="372" y="898" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">医学人员补充、说明或处理误报</text><rect x="350" y="980" width="690" height="136" rx="12" fill="#eff8f3" stroke="#bcdccd" stroke-width="2"/><rect x="350" y="992" width="7" height="112" rx="3" fill="#267c66"/><text x="372" y="1019" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="600" fill="#213b54">⑤ 医学人员确认</text><text x="372" y="1056" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">确认专业答复版本，提供给销售</text><text x="372" y="1088" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">保存确认人、来源、范围和原任务</text><rect x="350" y="1190" width="690" height="136" rx="12" fill="#ffffff" stroke="#cbd9e8" stroke-width="2"/><rect x="350" y="1202" width="7" height="112" rx="3" fill="#2c65a2"/><text x="372" y="1229" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="600" fill="#213b54">⑥ 销售制作交付物</text><text x="372" y="1266" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">基于确认答复，组织沟通稿或卡片</text><text x="372" y="1298" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">先固定模板，保留原文对照</text><rect x="350" y="1410" width="690" height="136" rx="12" fill="#ffffff" stroke="#cbd9e8" stroke-width="2"/><rect x="350" y="1422" width="7" height="112" rx="3" fill="#2c65a2"/><text x="372" y="1449" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="600" fill="#213b54">⑦ 使用反馈与经验整理</text><text x="372" y="1486" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">销售记录解决情况，形成补充任务</text><text x="372" y="1518" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">经验按场景、做法与结果保存</text><path d="M695 346 V410" fill="none" stroke="#53789b" stroke-width="3" marker-end="url(#blue)"/><path d="M695 546 V600" fill="none" stroke="#53789b" stroke-width="3" marker-end="url(#blue)"/><path d="M695 736 V790" fill="none" stroke="#53789b" stroke-width="3" marker-end="url(#blue)"/><path d="M695 926 V980" fill="none" stroke="#53789b" stroke-width="3" marker-end="url(#blue)"/><path d="M695 1116 V1190" fill="none" stroke="#53789b" stroke-width="3" marker-end="url(#blue)"/><path d="M695 1326 V1410" fill="none" stroke="#53789b" stroke-width="3" marker-end="url(#blue)"/><rect x="40" y="210" width="265" height="136" rx="12" fill="#fff6ea" stroke="#e9cda4" stroke-width="2"/><text x="62" y="249" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#b57525">背景需要补充</text><text x="62" y="286" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">在原任务内补充</text><text x="62" y="318" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">由销售确认原意</text><path d="M350 278 H305" fill="none" stroke="#b57525" stroke-width="3" marker-end="url(#amber)"/><rect x="40" y="410" width="265" height="136" rx="12" fill="#ffffff" stroke="#cbd9e8" stroke-width="2"/><text x="62" y="449" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#2c65a2">输入资料</text><text x="62" y="486" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">公开论文、说明书</text><text x="62" y="518" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">及已有医学知识</text><path d="M305 478 H350" fill="none" stroke="#53789b" stroke-width="3" marker-end="url(#blue)"/><rect x="40" y="780" width="265" height="170" rx="12" fill="#fff6ea" stroke="#e9cda4" stroke-width="2"/><text x="62" y="819" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#b57525">发现未处理项</text><text x="62" y="856" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">回医学人员处理</text><text x="62" y="888" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">缺背景再交销售</text><text x="62" y="920" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">资料不足可明确说明</text><path d="M350 858 H327 V668 H350" fill="none" stroke="#b57525" stroke-width="3" marker-end="url(#amber)"/><rect x="1075" y="980" width="285" height="172" rx="12" fill="#eff8f3" stroke="#bcdccd" stroke-width="2"/><text x="1097" y="1019" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#267c66">企业医学知识</text><text x="1097" y="1056" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">问题＋确认答复</text><text x="1097" y="1088" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">证据＋范围＋版本</text><text x="1097" y="1120" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">下次供医学人员核对</text><path d="M1040 1048 H1075" fill="none" stroke="#267c66" stroke-width="3" marker-end="url(#green)"/><rect x="1075" y="1190" width="285" height="180" rx="12" fill="#fff6ea" stroke="#e9cda4" stroke-width="2"/><text x="1097" y="1229" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#b57525">材料规则待讨论</text><text x="1097" y="1266" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">最终审核方式待定</text><text x="1097" y="1298" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">个人Agent范围待定</text><text x="1097" y="1330" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">Demo先展示预览</text><rect x="1075" y="1410" width="285" height="172" rx="12" fill="#eff8f3" stroke="#bcdccd" stroke-width="2"/><text x="1097" y="1449" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#267c66">个人／团队经验</text><text x="1097" y="1486" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">沟通过程与工作步骤</text><text x="1097" y="1518" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">经验、SOP、结果</text><text x="1097" y="1550" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">由销售核对保存</text><path d="M1040 1478 H1075" fill="none" stroke="#267c66" stroke-width="3" marker-end="url(#green)"/><rect x="40" y="1410" width="265" height="136" rx="12" fill="#eff8f3" stroke="#bcdccd" stroke-width="2"/><text x="62" y="1449" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#267c66">出现新医学问题</text><text x="62" y="1486" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">关联本次记录</text><text x="62" y="1518" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#253e57">回到需求澄清</text><path d="M350 1478 H305" fill="none" stroke="#267c66" stroke-width="3" marker-end="url(#green)"/><rect x="210" y="1640" width="980" height="120" rx="12" fill="#eff8f3" stroke="#bcdccd" stroke-width="2"/><rect x="210" y="1652" width="7" height="96" rx="3" fill="#267c66"/><text x="232" y="1679" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="600" fill="#213b54">下次工作可以参考什么</text><text x="232" y="1716" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#253e57">医学知识：为专业查证提供已有成果；经验与SOP：辅助准备和沟通。</text><path d="M695 1546 V1640" fill="none" stroke="#267c66" stroke-width="3" marker-end="url(#green)"/><text x="210" y="1805" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#647d93">产品设计 v3｜公开资料与模拟任务用于比赛演示；真实效果有待使用验证。</text></svg>